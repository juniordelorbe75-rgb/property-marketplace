services:
  - type: web
    name: habitard-marketplace
    runtime: docker
    region: virginia
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    autoDeployTrigger: commit
    envVars:
      - key: RENDER_DATABASE_URL
        fromDatabase:
          name: habitard-db
          property: connectionString
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: FORCE_HTTPS
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: TRUSTED_PROXY_IPS
        value: "127.0.0.1"
      - key: ADMIN_USER_IDS
        value: "1"
      - key: CORS_ORIGINS
        value: https://habitard-marketplace.netlify.app,https://habitard.juniordelorbe75.workers.dev
      - key: FRONTEND_URL
        value: https://habitard.juniordelorbe75.workers.dev
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_TIMEOUT_SECONDS
        value: "10"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: PROPERTY_IMAGE_STORAGE
        value: s3
      - key: OBJECT_STORAGE_BUCKET
        sync: false
      - key: OBJECT_STORAGE_REGION
        value: auto
      - key: OBJECT_STORAGE_ENDPOINT_URL
        sync: false
      - key: OBJECT_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: OBJECT_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: OBJECT_STORAGE_PUBLIC_BASE_URL
        sync: false

databases:
  - name: habitard-db
    databaseName: habitard
    user: habitard
    region: virginia
    plan: free
    ipAllowList: []
